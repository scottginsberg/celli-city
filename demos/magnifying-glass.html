<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Magnifying Glass Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Inter", Arial, sans-serif;
      background: #04060c;
      color: #e6ecff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #city-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #18233b 0%, #080b13 80%);
      cursor: crosshair;
      touch-action: none;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      max-width: 320px;
      padding: 12px 16px;
      background: rgba(8, 12, 24, 0.72);
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      line-height: 1.5;
    }

    #hud h1 {
      margin: 0 0 8px;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #7fc8ff;
    }

    #hud p {
      margin: 4px 0;
      font-size: 14px;
    }

    #info {
      position: absolute;
      left: 16px;
      bottom: 16px;
      padding: 10px 14px;
      background: rgba(14, 20, 35, 0.8);
      border-radius: 10px;
      font-size: 14px;
      letter-spacing: 0.02em;
      min-width: 220px;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="city-canvas" width="960" height="540"></canvas>
    <aside id="hud">
      <h1>Magnifying Glass</h1>
      <p>Press <strong>M</strong> to toggle the magnifier.</p>
      <p>Use <strong>scroll</strong> to zoom and <strong>drag</strong> to pan inside the circular HUD.</p>
      <p>Click a highlighted citizen to emit a selection event.</p>
    </aside>
    <div id="info">No citizen selected.</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="../src/demos/magnifyingGlassDemo.js"></script>
</body>
</html>
