<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Celli City &mdash; Master Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #1b2232, #050608 62%);
        color: #f2f4f8;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      #overlay {
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        max-width: 26rem;
        padding: 1rem 1.25rem;
        background: color-mix(in srgb, #0b1020 72%, transparent);
        border-radius: 0.9rem;
        backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid rgba(108, 141, 255, 0.18);
        box-shadow: 0 1.2rem 2.8rem rgba(2, 8, 20, 0.45);
        transition: opacity 0.35s ease;
        pointer-events: none;
      }

      #overlay h1 {
        margin: 0 0 0.35rem;
        font-size: 1.25rem;
        letter-spacing: 0.02em;
      }

      #overlay p {
        margin: 0;
        line-height: 1.4;
        font-size: 0.95rem;
        color: rgba(210, 218, 247, 0.9);
      }

      #keymap {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 1rem;
        padding: 0.6rem 1.2rem;
        border-radius: 999px;
        background: color-mix(in srgb, rgba(6, 10, 18, 0.9) 85%, transparent);
        border: 1px solid rgba(120, 144, 255, 0.25);
        box-shadow: 0 0.6rem 1.8rem rgba(2, 8, 20, 0.35);
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        color: rgba(220, 228, 255, 0.85);
        align-items: center;
      }

      #keymap span {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        opacity: 0.82;
      }

      #keymap kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.8rem;
        padding: 0.2rem 0.5rem;
        border-radius: 0.5rem;
        background: rgba(32, 44, 85, 0.6);
        border: 1px solid rgba(142, 174, 255, 0.35);
        font-size: 0.8rem;
        font-weight: 600;
        color: rgba(240, 245, 255, 0.92);
      }

      @media (max-width: 768px) {
        #overlay {
          max-width: calc(100% - 3rem);
        }

        #keymap {
          left: 1.5rem;
          right: 1.5rem;
          transform: none;
          justify-content: center;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div id="overlay" role="status" aria-live="polite"></div>
    <div id="keymap" aria-hidden="true">
      <span><kbd>Space</kbd> advance stage</span>
      <span><kbd>A</kbd> toggle auto-cycle</span>
      <span><kbd>Shift</kbd> + <kbd>Space</kbd> reverse</span>
    </div>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm";

      const overlay = document.getElementById("overlay");

      class WorldOrchestrator {
        constructor({ camera, overlayElement }) {
          this.camera = camera;
          this.overlay = overlayElement;
          this.states = [];
          this.currentIndex = -1;
          this.transition = null;
          this.currentLookAt = new THREE.Vector3();
          this.params = {
            autoCycle: true,
            cycleSeconds: 8,
          };
          this._elapsedSinceChange = 0;
          this.onTransitionStart = null;
          this.onStateChange = null;
        }

        registerState(config) {
          const state = {
            duration: 4200,
            ...config,
            index: this.states.length,
          };

          if (!state.position) {
            throw new Error("World state requires a target camera position");
          }

          if (!state.lookAt) {
            state.lookAt = new THREE.Vector3();
          }

          this.states.push(state);
          return state;
        }

        getStateNames() {
          return this.states.map((state) => state.name);
        }

        setStateByName(name, options = {}) {
          const index = this.states.findIndex((state) => state.name === name);
          if (index >= 0) {
            this.setStateByIndex(index, options);
          }
        }

        setStateByIndex(index, { immediate = false } = {}) {
          const targetState = this.states[index];
          if (!targetState) return;

          if (immediate || this.currentIndex === -1) {
            this.currentIndex = index;
            this.currentLookAt.copy(targetState.lookAt);
            this.camera.position.copy(targetState.position);
            this.camera.lookAt(this.currentLookAt);
            this.transition = null;
            this._elapsedSinceChange = 0;
            if (targetState.onEnter) targetState.onEnter();
            if (this.onStateChange) this.onStateChange(targetState, true);
            return;
          }

          if (this.transition && this.transition.targetIndex === index) {
            return;
          }

          this.transition = {
            start: performance.now(),
            duration: targetState.duration,
            fromPosition: this.camera.position.clone(),
            toPosition: targetState.position.clone(),
            fromLookAt: this.currentLookAt.clone(),
            toLookAt: targetState.lookAt.clone(),
            targetIndex: index,
          };

          if (this.onTransitionStart) {
            this.onTransitionStart(targetState);
          }
        }

        goToNextState() {
          if (!this.states.length) return;
          const nextIndex = (this.currentIndex + 1) % this.states.length;
          this.setStateByIndex(nextIndex);
        }

        goToPreviousState() {
          if (!this.states.length) return;
          const prevIndex = (this.currentIndex - 1 + this.states.length) % this.states.length;
          this.setStateByIndex(prevIndex);
        }

        update(deltaSeconds) {
          if (this.transition) {
            const now = performance.now();
            const progress = Math.min((now - this.transition.start) / this.transition.duration, 1);
            const eased = progress * progress * (3 - 2 * progress);
            this.camera.position.lerpVectors(
              this.transition.fromPosition,
              this.transition.toPosition,
              eased
            );
            this.currentLookAt.lerpVectors(
              this.transition.fromLookAt,
              this.transition.toLookAt,
              eased
            );
            this.camera.lookAt(this.currentLookAt);

            if (progress >= 1) {
              this.currentIndex = this.transition.targetIndex;
              this.transition = null;
              this._elapsedSinceChange = 0;
              const state = this.states[this.currentIndex];
              if (state.onEnter) state.onEnter();
              if (this.onStateChange) this.onStateChange(state, false);
            }
            return;
          }

          if (this.currentIndex === -1 || !this.states.length) return;

          this.camera.lookAt(this.currentLookAt);

          this._elapsedSinceChange += deltaSeconds;
          if (this.params.autoCycle && this.states.length > 1) {
            if (this._elapsedSinceChange >= this.params.cycleSeconds) {
              this.goToNextState();
            }
          }
        }
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0d16);
      scene.fog = new THREE.Fog(0x0a0d16, 80, 240);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(80, 40, 120);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.minDistance = 5;
      controls.maxDistance = 180;
      controls.enabled = false;

      const keyHints = {
        title: "Initializing",
        description: "Setting up world subsystems&hellip;",
      };

      function updateOverlay({ title, description }) {
        if (title) keyHints.title = title;
        if (description) keyHints.description = description;
        overlay.innerHTML = `
          <h1>${keyHints.title}</h1>
          <p>${keyHints.description}</p>
        `;
      }

      updateOverlay({
        title: "Booting world orchestration",
        description: "Loading scene assets and diagnostics",
      });

      const orchestrator = new WorldOrchestrator({ camera, overlayElement: overlay });

      const ambientLight = new THREE.AmbientLight(0xcfd7ff, 0.32);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xffe3b1, 1.2);
      sunLight.position.set(60, 120, 80);
      sunLight.castShadow = false;
      scene.add(sunLight);

      function createCityExterior() {
        const group = new THREE.Group();
        group.name = "City Exterior";

        const groundGeometry = new THREE.CircleGeometry(160, 48);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x222a38, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        group.add(ground);

        const district = new THREE.Group();
        const buildingMaterial = new THREE.MeshStandardMaterial({
          color: 0x415a9c,
          metalness: 0.2,
          roughness: 0.6,
        });

        const towerMaterial = new THREE.MeshStandardMaterial({
          color: 0x96b5ff,
          emissive: 0x0a162c,
          emissiveIntensity: 0.4,
        });

        for (let i = 0; i < 40; i++) {
          const width = THREE.MathUtils.randFloat(4, 12);
          const depth = THREE.MathUtils.randFloat(4, 12);
          const height = THREE.MathUtils.randFloat(12, 48);
          const geometry = new THREE.BoxGeometry(width, height, depth);
          const material = Math.random() > 0.82 ? towerMaterial : buildingMaterial;
          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set(
            THREE.MathUtils.randFloatSpread(120),
            height / 2,
            THREE.MathUtils.randFloatSpread(120)
          );
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          district.add(mesh);
        }

        group.add(district);

        const transitRing = new THREE.TorusGeometry(70, 0.6, 16, 128);
        const ringMaterial = new THREE.MeshStandardMaterial({
          color: 0x50c4ff,
          emissive: 0x1f3456,
          emissiveIntensity: 0.85,
          metalness: 0.7,
          roughness: 0.3,
        });
        const ring = new THREE.Mesh(transitRing, ringMaterial);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 12;
        group.add(ring);

        return group;
      }

      function createRoomWindow() {
        const group = new THREE.Group();
        group.name = "Observation Loft";
        group.position.set(0, 18, 52);

        const room = new THREE.Mesh(
          new THREE.BoxGeometry(24, 14, 16),
          new THREE.MeshStandardMaterial({
            color: 0xf5f5f1,
            side: THREE.BackSide,
            roughness: 0.7,
            metalness: 0.05,
          })
        );
        room.position.y = 7;
        group.add(room);

        const windowFrame = new THREE.Mesh(
          new THREE.BoxGeometry(20, 10, 0.8),
          new THREE.MeshStandardMaterial({ color: 0x4f6ad7, metalness: 0.6, roughness: 0.4 })
        );
        windowFrame.position.set(0, 7, -8);
        group.add(windowFrame);

        const windowGlass = new THREE.Mesh(
          new THREE.PlaneGeometry(18.4, 9),
          new THREE.MeshPhysicalMaterial({
            color: 0xaad7ff,
            opacity: 0.28,
            transparent: true,
            roughness: 0.12,
            transmission: 0.9,
            thickness: 0.45,
          })
        );
        windowGlass.position.set(0, 7, -7.6);
        group.add(windowGlass);

        const consoleDesk = new THREE.Mesh(
          new THREE.BoxGeometry(12, 1.2, 3),
          new THREE.MeshStandardMaterial({ color: 0x242a3d, metalness: 0.4, roughness: 0.7 })
        );
        consoleDesk.position.set(0, 4, -4.6);
        group.add(consoleDesk);

        const consoleScreen = new THREE.Mesh(
          new THREE.PlaneGeometry(10, 3.2),
          new THREE.MeshStandardMaterial({
            color: 0x67b0ff,
            emissive: 0x1a2f4f,
            emissiveIntensity: 1.2,
          })
        );
        consoleScreen.position.set(0, 5.6, -3.1);
        consoleScreen.rotation.x = -Math.PI / 12;
        group.add(consoleScreen);

        const interiorLight = new THREE.PointLight(0xcfd5ff, 0.9, 26);
        interiorLight.position.set(0, 11.5, 0);
        group.add(interiorLight);

        return group;
      }

      function createMicroCity() {
        const group = new THREE.Group();
        group.name = "Micro City";
        group.position.set(0, 4.5, -1.2);

        const platform = new THREE.Mesh(
          new THREE.CylinderGeometry(4.2, 4.4, 1.2, 48),
          new THREE.MeshStandardMaterial({
            color: 0x1d2337,
            metalness: 0.3,
            roughness: 0.6,
            emissive: 0x141b2a,
            emissiveIntensity: 0.4,
          })
        );
        platform.position.y = 0.6;
        group.add(platform);

        const halo = new THREE.Mesh(
          new THREE.TorusGeometry(4.6, 0.12, 16, 64),
          new THREE.MeshStandardMaterial({
            color: 0x6ad6ff,
            emissive: 0x274a6a,
            emissiveIntensity: 1.4,
            metalness: 0.9,
            roughness: 0.2,
          })
        );
        halo.position.y = 2.8;
        group.add(halo);

        const miniatureDistrict = new THREE.Group();
        const miniMaterial = new THREE.MeshStandardMaterial({
          color: 0x9cc6ff,
          emissive: 0x223c6b,
          emissiveIntensity: 0.55,
          metalness: 0.4,
          roughness: 0.35,
        });

        for (let i = 0; i < 18; i++) {
          const geometry = new THREE.BoxGeometry(
            THREE.MathUtils.randFloat(0.4, 1.1),
            THREE.MathUtils.randFloat(1.2, 2.6),
            THREE.MathUtils.randFloat(0.4, 1.1)
          );
          const mesh = new THREE.Mesh(geometry, miniMaterial);
          const angle = (i / 18) * Math.PI * 2;
          const radius = THREE.MathUtils.randFloat(0.4, 2.1);
          mesh.position.set(Math.cos(angle) * radius, geometry.parameters.height / 2 + 1.1, Math.sin(angle) * radius);
          miniatureDistrict.add(mesh);
        }

        group.add(miniatureDistrict);

        const inspectionLight = new THREE.PointLight(0x9ad8ff, 1.3, 16);
        inspectionLight.position.set(0, 5.8, 0);
        group.add(inspectionLight);

        return { group, miniatureDistrict };
      }

      const cityExterior = createCityExterior();
      scene.add(cityExterior);

      const observationLoft = createRoomWindow();
      scene.add(observationLoft);

      const { group: microCity, miniatureDistrict } = createMicroCity();
      observationLoft.add(microCity);

      const floatingDustGeometry = new THREE.SphereGeometry(0.12, 8, 8);
      const floatingDustMaterial = new THREE.MeshBasicMaterial({ color: 0x7aa3ff, transparent: true, opacity: 0.25 });
      const dustParticles = [];
      for (let i = 0; i < 180; i++) {
        const particle = new THREE.Mesh(floatingDustGeometry, floatingDustMaterial);
        particle.position.set(
          THREE.MathUtils.randFloatSpread(180),
          THREE.MathUtils.randFloat(4, 80),
          THREE.MathUtils.randFloatSpread(180)
        );
        particle.userData = {
          baseY: particle.position.y,
          speed: THREE.MathUtils.randFloat(0.15, 0.55),
          offset: Math.random() * Math.PI * 2,
        };
        dustParticles.push(particle);
        scene.add(particle);
      }

      orchestrator.registerState({
        name: "City Exterior",
        description: "Macro view across the transit ring and skyline of the macro city.",
        position: new THREE.Vector3(110, 60, 110),
        lookAt: new THREE.Vector3(0, 18, 0),
        duration: 5200,
      });

      orchestrator.registerState({
        name: "Observation Loft",
        description: "Approach the research loft hovering along the exterior ring to peek inside.",
        position: new THREE.Vector3(12, 22, 34),
        lookAt: new THREE.Vector3(0, 18, 48),
        duration: 4200,
      });

      orchestrator.registerState({
        name: "Micro City",
        description: "Zoom inside the loft to inspect the micro-scale replica resting on the platform.",
        position: new THREE.Vector3(0.8, 6.1, 48.5),
        lookAt: new THREE.Vector3(0, 5.1, 46.9),
        duration: 3800,
        onEnter: () => {
          miniatureDistrict.rotation.y = 0;
        },
      });

      orchestrator.setStateByIndex(0, { immediate: true });

      orchestrator.onTransitionStart = (state) => {
        updateOverlay({
          title: `Transitioning to ${state.name}`,
          description: state.description,
        });
      };

      orchestrator.onStateChange = (state, immediate) => {
        const lead = immediate ? "Initialized at" : "Now exploring";
        updateOverlay({
          title: `${lead} ${state.name}`,
          description: state.description,
        });
      };

      const gui = new GUI({ title: "World Diagnostics" });
      gui.domElement.style.userSelect = "none";

      const stateControls = {
        state: orchestrator.getStateNames()[0],
      };

      const stateFolder = gui.addFolder("World States");
      const stateController = stateFolder
        .add(stateControls, "state", orchestrator.getStateNames())
        .name("Active State");
      stateController.onChange((name) => {
        orchestrator.params.autoCycle = false;
        orchestrator.setStateByName(name);
      });

      stateFolder
        .add(orchestrator.params, "autoCycle")
        .name("Auto Cycle")
        .onChange((value) => {
          if (value) orchestrator.setStateByName(stateControls.state, { immediate: false });
        });
      stateFolder
        .add(orchestrator.params, "cycleSeconds", 4, 20, 1)
        .name("Cycle Seconds");
      stateFolder.add({ next: () => orchestrator.goToNextState() }, "next").name("Advance");
      stateFolder.add({ prev: () => orchestrator.goToPreviousState() }, "prev").name("Rewind");

      orchestrator.onStateChange = (state, immediate) => {
        stateControls.state = state.name;
        stateController.updateDisplay();
        const lead = immediate ? "Initialized at" : "Now exploring";
        updateOverlay({
          title: `${lead} ${state.name}`,
          description: state.description,
        });
      };

      const subsystemFolder = gui.addFolder("Subsystem Visibility");
      const subsystemVisibility = {
        "City Exterior": true,
        "Observation Loft": true,
        "Micro City": true,
      };

      subsystemFolder
        .add(subsystemVisibility, "City Exterior")
        .onChange((value) => {
          cityExterior.visible = value;
        });
      subsystemFolder
        .add(subsystemVisibility, "Observation Loft")
        .onChange((value) => {
          observationLoft.visible = value;
        });
      subsystemFolder
        .add(subsystemVisibility, "Micro City")
        .onChange((value) => {
          microCity.visible = value;
        });

      const diagnosticsFolder = gui.addFolder("Diagnostics");
      const diagnostics = {
        resolution: "",
        memory: "",
        geometries: 0,
        textures: 0,
      };
      const sizeVector = new THREE.Vector2();

      const diagControllers = {
        resolution: diagnosticsFolder.add(diagnostics, "resolution").name("Render Target").listen(),
        memory: diagnosticsFolder.add(diagnostics, "memory").name("JS Heap").listen(),
        geometries: diagnosticsFolder.add(diagnostics, "geometries").name("Geometries").listen(),
        textures: diagnosticsFolder.add(diagnostics, "textures").name("Textures").listen(),
      };

      diagnosticsFolder
        .add({ dump: () => console.table(renderer.info.render) }, "dump")
        .name("Log Render Info");

      function refreshDiagnostics() {
        renderer.getSize(sizeVector);
        diagnostics.resolution = `${Math.round(sizeVector.x)} × ${Math.round(sizeVector.y)} @ ${Math.round(
          window.devicePixelRatio * 100
        ) / 100}x`;
        diagnostics.geometries = renderer.info.memory.geometries;
        diagnostics.textures = renderer.info.memory.textures;
        if (performance && performance.memory) {
          const { usedJSHeapSize, jsHeapSizeLimit } = performance.memory;
          diagnostics.memory = `${(usedJSHeapSize / 1048576).toFixed(1)} / ${(jsHeapSizeLimit / 1048576).toFixed(1)} MB`;
        } else {
          diagnostics.memory = "performance.memory unavailable";
        }
      }

      refreshDiagnostics();

      const clock = new THREE.Clock();
      let diagTimer = 0;

      function animate() {
        const delta = clock.getDelta();
        diagTimer += delta;

        orchestrator.update(delta);
        controls.update();

        miniatureDistrict.rotation.y += delta * 0.35;
        microCity.position.y = 4.5 + Math.sin(performance.now() * 0.0018) * 0.2;

        for (const particle of dustParticles) {
          const { baseY, speed, offset } = particle.userData;
          particle.position.y = baseY + Math.sin(performance.now() * 0.0006 * speed + offset) * 1.8;
        }

        renderer.render(scene, camera);

        if (diagTimer > 1) {
          refreshDiagnostics();
          diagTimer = 0;
        }

        requestAnimationFrame(animate);
      }

      animate();

      function handleResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        refreshDiagnostics();
      }

      window.addEventListener("resize", handleResize);

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          orchestrator.params.autoCycle = false;
          if (event.shiftKey) {
            orchestrator.goToPreviousState();
          } else {
            orchestrator.goToNextState();
          }
          gui.controllersRecursive?.forEach?.((controller) => controller.updateDisplay?.());
        }

        if (event.key.toLowerCase() === "a") {
          orchestrator.params.autoCycle = !orchestrator.params.autoCycle;
          stateFolder.controllersRecursive?.forEach?.((controller) => controller.updateDisplay?.());
        }
      });

      updateOverlay({
        title: "Initialized at City Exterior",
        description: "Macro view across the transit ring and skyline of the macro city.",
      });
    </script>
  </body>
</html>
