<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Celli City Experiments</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 48px 24px;
      min-height: 100vh;
      background: radial-gradient(circle at top, #16213f, #070a13 70%);
      color: #e7ecff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      max-width: 640px;
      width: 100%;
      background: rgba(10, 14, 28, 0.75);
      border-radius: 18px;
      padding: 32px 40px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }
    h1 {
      margin-top: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 26px;
      color: #7fc8ff;
    }
    p {
      line-height: 1.6;
      color: rgba(231, 236, 255, 0.78);
    }
    ul {
      padding-left: 22px;
    }
    a {
      color: #9cd5ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Celli City Playgrounds</h1>
    <p>Select a demo to explore interactive micro-city tooling.</p>
    <ul>
      <li><a href="./demos/magnifying-glass.html">Magnifying Glass HUD Tool</a></li>
    </ul>
  </main>
</body>
</html>
